  <rect x="280" y="174" width="460" height="16" rx="8" fill="#1e293b"/>
  <rect x="280" y="174" width="391" height="16" rx="8" fill="url(#barGrad)"/>
  <text x="715" y="186" class="pct" text-anchor="end">85%</text>

  <text x="32" y="228" class="label">Apache Airflow</text>
  <rect x="280" y="214" width="460" height="16" rx="8" fill="#1e293b"/>
  <rect x="280" y="214" width="299" height="16" rx="8" fill="url(#barGrad)"/>
  <text x="715" y="226" class="pct" text-anchor="end">65%</text>

