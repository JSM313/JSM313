  <rect x="280" y="254" width="460" height="16" rx="8" fill="#1e293b"/>
  <rect x="280" y="254" width="322" height="16" rx="8" fill="url(#barGrad)"/>
  <text x="715" y="266" class="pct" text-anchor="end">70%</text>

  <text x="32" y="308" class="label">Microsoft Azure</text>
  <rect x="280" y="294" width="460" height="16" rx="8" fill="#1e293b"/>
  <rect x="280" y="294" width="253" height="16" rx="8" fill="url(#barGrad)"/>
  <text x="715" y="306" class="pct" text-anchor="end">55%</text>

