<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <style>
      .label { font-family: 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; font-size: 15px; }
      .pct   { font-family: 'Fira Code', monospace; fill: #94a3b8; font-size: 13px; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; fill: #ffffff; font-size: 22px; font-weight: 700; }
      .sub   { font-family: 'Fira Code', monospace; fill: #64748b; font-size: 12px; }
      .bar   { rx: 6; }
    </style>
  </defs>

  <rect width="800" height="420" rx="14" fill="url(#bgGrad)"/>

  <text x="32" y="46" class="title">Skill Proficiency</text>
  <text x="32" y="66" class="sub">// self-reported, updated by hand — not auto-generated</text>

  <!-- Row template: label at x=32, bar starts x=280, width scaled to 460 max, ends ~x=740 -->

  <text x="32" y="108" class="label">SQL</text>
  <rect x="280" y="94" width="460" height="16" rx="8" fill="#1e293b"/>
  <rect x="280" y="94" width="425" height="16" rx="8" fill="url(#barGrad)"/>
